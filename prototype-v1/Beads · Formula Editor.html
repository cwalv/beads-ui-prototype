<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Beads · Formula Editor</title>
<meta name="viewport" content="width=1400" />
<style>
  :root {
    --bg: #fdfdfc;
    --bg-2: #f7f6f3;
    --bg-3: #eeece5;
    --ink: #1a1a1a;
    --ink-2: #2f2f2f;
    --ink-3: #555;
    --mute: #7a7a7a;
    --mute-2: #a8a8a5;
    --rule: #e3e1db;
    --rule-2: #efede7;
    --accent: #2f6fe8;
    --accent-soft: #e3edfd;
    --danger: #b23a3a;
    --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: "JetBrains Mono", "SF Mono", "Menlo", "Monaco", Consolas, monospace;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); height: 100%; }
  body { font-family: var(--font-sans); color: var(--ink); }
  * { box-sizing: border-box; }

  .badge {
    font-family: var(--font-mono); font-size: 10px;
    padding: 1px 6px; border-radius: 2px;
    background: var(--bg-2); color: var(--ink-3);
    border: 1px solid var(--rule-2);
  }
</style>
<link rel="stylesheet" href="editor-styles.css" />
</head>
<body>
<div id="root"></div>

<!-- TWEAK_DEFAULTS (not wired, reserved) -->
<script>
  window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "light"
  }/*EDITMODE-END*/;
</script>

<!-- Load formula TOML as a text resource, then boot React -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="editor-toml.jsx"></script>
<script type="text/babel" src="editor-dag.jsx"></script>
<script type="text/babel" src="editor-app.jsx"></script>

<script type="text/babel">
  (async () => {
    let src = "";
    try {
      const res = await fetch("gastownhall-upstream.formula.toml");
      src = await res.text();
    } catch (e) {
      src = "# failed to load formula file\nformula = \"unknown\"\nversion = 1\n";
    }
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<EditorApp initialSrc={src} />);
  })();
</script>
</body>
</html>
