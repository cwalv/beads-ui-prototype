// beads.v1 — read-side wire schema for the bd issue tracker.
//
// Field numbers are forever once shipped. Reserve liberally; never reuse.
//
// Customs: bd allows operators to register custom statuses, types, and
// dep types via `bd config set status.custom`, `types.custom`, and
// per-dependency creation. Therefore status / type / dep_type are `string`,
// not proto enums. Canonical values are listed in the field comments;
// renderers narrow on those and pass customs through with a neutral
// fallback.
//
// JSON names: bd's existing wire format is snake_case (Go `json:"..."` tags
// on `internal/types/types.go::Issue`). Multi-word fields therefore set
// `[json_name = "<snake_case>"]` so that protojson serialization and the
// generated TS `*Json` types match bd-server's current output without a
// translation layer.

syntax = "proto3";

package beads.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cwalv/beads-ui-prototype/proto/gen/go/beads/v1;beadsv1";

// Bead is one row of bd's `issues` (or `wisps`) table, plus the auxiliary
// data populated by `bd show --json` / `bd list --json` (labels,
// dependencies, comments, computed parent, epic-progress rollup).
//
// Sources: github/gastownhall/beads/internal/types/types.go (`Issue`,
// `IssueDetails`, `IssueWithCounts`).
message Bead {
  // ===== Identification =====
  string id = 1;
  reserved 2 to 9; // future identification surface (content_hash is JSON-excluded)

  // ===== Body / content =====
  string title = 10;
  string description = 11;
  string design = 12;
  string acceptance_criteria = 13 [json_name = "acceptance_criteria"];
  string notes = 14;
  string spec_id = 15 [json_name = "spec_id"];
  reserved 16 to 19;

  // ===== Workflow =====
  // Canonical statuses: open | in_progress | blocked | deferred | closed |
  // pinned | hooked. Customs are accepted; `pinned` is also a separate
  // boolean column (see `pinned` field below).
  string status = 20;
  // 0=critical (P0), 1=high, 2=medium (default), 3=low, 4=backlog. No
  // omit-on-zero: 0 is a valid value distinct from missing.
  int32 priority = 21;
  // Canonical types: bug | feature | task | epic | chore | decision |
  // message | molecule | spike | story | milestone | event. Removed but
  // commonly seen as customs: gate | convoy | merge-request | slot |
  // agent | role | rig.
  string type = 22;
  reserved 23 to 29;

  // ===== Assignment =====
  string assignee = 30;
  string owner = 31;
  optional int32 estimated_minutes = 32 [json_name = "estimated_minutes"];
  reserved 33 to 39;

  // ===== Timestamps =====
  google.protobuf.Timestamp created_at = 40 [json_name = "created_at"];
  string created_by = 41 [json_name = "created_by"];
  google.protobuf.Timestamp updated_at = 42 [json_name = "updated_at"];
  optional google.protobuf.Timestamp started_at = 43 [json_name = "started_at"];
  optional google.protobuf.Timestamp closed_at = 44 [json_name = "closed_at"];
  string close_reason = 45 [json_name = "close_reason"];
  string closed_by_session = 46 [json_name = "closed_by_session"];
  reserved 47 to 49;

  // ===== Time-based scheduling =====
  optional google.protobuf.Timestamp due_at = 50 [json_name = "due_at"];
  optional google.protobuf.Timestamp defer_until = 51 [json_name = "defer_until"];
  reserved 52 to 59;

  // ===== External integration =====
  optional string external_ref = 60 [json_name = "external_ref"];
  string source_system = 61 [json_name = "source_system"];
  reserved 62 to 69;

  // ===== Custom metadata =====
  // Free-form JSON. Validated as well-formed JSON by bd; optionally
  // schema-checked via `metadata.validation` config. Wire format is the
  // raw JSON object (`google.protobuf.Struct` round-trips as such).
  google.protobuf.Struct metadata = 70;
  reserved 71 to 79;

  // ===== Compaction metadata =====
  int32 compaction_level = 80 [json_name = "compaction_level"];
  optional google.protobuf.Timestamp compacted_at = 81 [json_name = "compacted_at"];
  optional string compacted_at_commit = 82 [json_name = "compacted_at_commit"];
  int32 original_size = 83 [json_name = "original_size"];
  reserved 84 to 89;

  // 90-99 reserved for internal-routing fields that are currently
  // JSON-excluded in the Go struct (source_repo, IDPrefix,
  // PrefixOverride). They are not part of the public read surface.
  reserved 90 to 99;

  // ===== Relational data (populated by bd show; partial for bd list) =====
  repeated string labels = 100;
  // Edges where this bead depends on others. Each element is the
  // depended-on bead with `dependency_type` populated to identify the
  // edge kind. Mirrors `IssueDetails.Dependencies`.
  repeated Bead dependencies = 101;
  // Edges where other beads depend on this one. Same shape as above.
  repeated Bead dependents = 102;
  repeated Comment comments = 103;
  // Convenience: the parent ID computed from the `parent-child` edge in
  // dependencies, when present. Mirrors `IssueDetails.Parent`.
  optional string parent = 104;
  reserved 105 to 109;

  // ===== Messaging / wisp routing =====
  string sender = 110;
  bool ephemeral = 111;
  bool no_history = 112 [json_name = "no_history"];
  string wisp_type = 113 [json_name = "wisp_type"];
  reserved 114 to 119;

  // ===== Context markers =====
  // Note: this is the `pinned` boolean column — a persistent context
  // marker. The status value `'pinned'` is independent (it lives in
  // `status` above).
  bool pinned = 120;
  bool is_template = 121 [json_name = "is_template"];
  reserved 122 to 129;

  // 130-139 reserved for compound molecule lineage (`bonded_from`).
  reserved 130 to 139;

  // ===== Gate fields (async coordination) =====
  string await_type = 140 [json_name = "await_type"];
  string await_id = 141 [json_name = "await_id"];
  optional google.protobuf.Duration timeout = 142;
  repeated string waiters = 143;
  reserved 144 to 149;

  // ===== Source tracing (formula cooking origin) =====
  string source_formula = 150 [json_name = "source_formula"];
  string source_location = 151 [json_name = "source_location"];
  reserved 152 to 159;

  // ===== Molecule / work classification =====
  // Canonical mol_type: swarm | patrol | work (empty defaults to work).
  string mol_type = 160 [json_name = "mol_type"];
  // Canonical work_type: mutex | open_competition (empty defaults to mutex).
  string work_type = 161 [json_name = "work_type"];
  reserved 162 to 169;

  // ===== Event fields (issue_type='event' only) =====
  string event_kind = 170 [json_name = "event_kind"];
  string actor = 171;
  string target = 172;
  string payload = 173;
  reserved 174 to 179;

  // ===== Epic progress rollup (populated by bd show for type=epic) =====
  optional int32 epic_total_children = 180 [json_name = "epic_total_children"];
  optional int32 epic_closed_children = 181 [json_name = "epic_closed_children"];
  optional bool epic_closeable = 182 [json_name = "epic_closeable"];
  reserved 183 to 199;

  // ===== List response augments (IssueWithCounts) =====
  // Populated by bd list --json. Not present on bd show responses.
  optional int32 dependency_count = 200 [json_name = "dependency_count"];
  optional int32 dependent_count = 201 [json_name = "dependent_count"];
  optional int32 comment_count = 202 [json_name = "comment_count"];
  reserved 203 to 219;

  // ===== Edge context =====
  // Set when this Bead appears inside another bead's `dependencies` or
  // `dependents` array — identifies the edge kind connecting to the
  // outer bead. Empty when this bead is the top-level subject.
  // Mirrors `IssueWithDependencyMetadata.DependencyType`.
  // Canonical dep types: blocks | parent-child | conditional-blocks |
  // waits-for | related | discovered-from | replies-to | relates-to |
  // duplicates | supersedes | authored-by | assigned-to | approved-by |
  // attests | tracks | until | caused-by | validates | delegated-from.
  string dependency_type = 220 [json_name = "dependency_type"];
  reserved 221 to 299;
}

// Dependency is a single edge in the `dependencies` table. Most clients
// receive edges via `Bead.dependencies` / `Bead.dependents` (which embed
// the full target bead); this message is for raw edge listings.
message Dependency {
  string issue_id = 1 [json_name = "issue_id"];
  string depends_on_id = 2 [json_name = "depends_on_id"];
  // Canonical dep types — see Bead.dependency_type.
  string type = 3;
  google.protobuf.Timestamp created_at = 4 [json_name = "created_at"];
  string created_by = 5 [json_name = "created_by"];
  // JSON blob carrying type-specific edge data (`WaitsForMeta`,
  // `AttestsMeta`, etc.).
  string metadata = 6;
  // Groups conversation edges (replies-to chains).
  string thread_id = 7 [json_name = "thread_id"];
  reserved 8 to 19;
}

// Comment is a row in the `comments` table.
message Comment {
  string id = 1;
  string issue_id = 2 [json_name = "issue_id"];
  string author = 3;
  string text = 4;
  google.protobuf.Timestamp created_at = 5 [json_name = "created_at"];
  reserved 6 to 19;
}

// Event is a row in the `events` table (audit trail). Distinct from
// type=event beads (which use Bead.event_kind / actor / target / payload).
message Event {
  string id = 1;
  string issue_id = 2 [json_name = "issue_id"];
  // Canonical kinds: created | updated | status_changed | commented |
  // closed | reopened | dependency_added | dependency_removed |
  // label_added | label_removed | compacted.
  string event_type = 3 [json_name = "event_type"];
  string actor = 4;
  optional string old_value = 5 [json_name = "old_value"];
  optional string new_value = 6 [json_name = "new_value"];
  optional string comment = 7;
  google.protobuf.Timestamp created_at = 8 [json_name = "created_at"];
  reserved 9 to 19;
}

// Workspace is one entry in bd-server's `/v1/workspaces` response.
// Multiple workspaces share one bd-server; each maps to a `.beads/` root.
message Workspace {
  string name = 1;
  string path = 2;
  bool reachable = 3;
  // Optional UI hints (not currently set by bd-server, reserved for
  // future workspace metadata).
  optional string description = 4;
  optional string color = 5;
  reserved 6 to 19;
}
